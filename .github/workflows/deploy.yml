name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy ikimono-scan.app to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "${CONFIRMATION}" = "deploy ikimono-scan.app"
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.8.13
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deployment tools
        run: scripts/install_ci_tools.sh terraform task
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          npm --prefix web ci
      - name: Run deployment gates
        run: task deploy:check
      - name: Bootstrap remote state
        run: task infra:bootstrap
      - name: Verify R2 lock semantics
        run: task infra:lock-test
      - name: Back up bootstrap state
        run: python scripts/terraform_backend.py backup bootstrap post-apply
      - name: Create storage plan
        run: |
          terraform -chdir=infra/storage init -input=false
          terraform -chdir=infra/storage plan -input=false -lock-timeout=5m -out=storage.tfplan
      - name: Back up storage state before apply
        run: python scripts/terraform_backend.py backup storage pre-apply
      - name: Apply saved storage plan
        run: terraform -chdir=infra/storage apply -input=false storage.tfplan
      - name: Back up storage state after apply
        run: python scripts/terraform_backend.py backup storage post-apply
      - name: Create production plan
        run: |
          terraform -chdir=infra/production init -input=false
          terraform -chdir=infra/production plan -input=false -lock-timeout=5m -out=production.tfplan
      - name: Back up state before apply
        run: python scripts/terraform_backend.py backup production pre-apply
      - name: Apply saved production plan
        run: terraform -chdir=infra/production apply -input=false production.tfplan
      - name: Back up state after apply
        run: python scripts/terraform_backend.py backup production post-apply
      - name: Smoke test
        run: task deploy:smoke
