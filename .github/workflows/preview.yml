name: Provision mobile preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type provision dev.ikimono-scan.app to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-infrastructure
  cancel-in-progress: false

jobs:
  provision:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "${CONFIRMATION}" = "provision dev.ikimono-scan.app"
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Install tools
        run: scripts/install_ci_tools.sh terraform
      - name: Initialize preview state
        run: terraform -chdir=infra/preview init -input=false
      - name: Create preview plan
        run: terraform -chdir=infra/preview plan -input=false -lock-timeout=5m -out=preview.tfplan
      - name: Back up state before apply
        run: python scripts/terraform_backend.py backup preview pre-apply
      - name: Apply saved preview plan
        run: terraform -chdir=infra/preview apply -input=false preview.tfplan
      - name: Back up state after apply
        run: python scripts/terraform_backend.py backup preview post-apply
