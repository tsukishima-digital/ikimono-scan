name: Unpublish production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type unpublish ikimono-scan.app to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  unpublish:
    name: Remove public domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "${CONFIRMATION}" = "unpublish ikimono-scan.app"
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install infrastructure tools
        run: scripts/install_ci_tools.sh terraform task
      - name: Build deployable assets
        run: npm --prefix web ci && npm --prefix web run build
      - name: Initialize production state
        run: terraform -chdir=infra/production init -input=false
      - name: Create unpublish plan
        run: terraform -chdir=infra/production plan -input=false -lock-timeout=5m -var=site_published=false -out=unpublish.tfplan
      - name: Back up state before apply
        run: python scripts/terraform_backend.py backup production pre-apply
      - name: Apply saved unpublish plan
        run: terraform -chdir=infra/production apply -input=false unpublish.tfplan
      - name: Back up state after apply
        run: python scripts/terraform_backend.py backup production post-apply
      - name: Verify application is unavailable
        run: task unpublish:smoke
