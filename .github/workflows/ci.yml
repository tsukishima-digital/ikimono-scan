name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect infrastructure changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]] || \
            python scripts/changed_scope.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --scope infra; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install Terraform
        if: steps.scope.outputs.run == 'true'
        run: scripts/install_ci_tools.sh terraform
      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build deployable assets
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: npm ci && npm run build
      - name: Check Terraform formatting
        if: steps.scope.outputs.run == 'true'
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap root
        if: steps.scope.outputs.run == 'true'
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate
      - name: Validate storage root
        if: steps.scope.outputs.run == 'true'
        run: terraform -chdir=infra/storage init -backend=false -input=false && terraform -chdir=infra/storage validate
      - name: Validate preview root
        if: steps.scope.outputs.run == 'true'
        run: terraform -chdir=infra/preview init -backend=false -input=false && terraform -chdir=infra/preview validate
      - name: Validate production root
        if: steps.scope.outputs.run == 'true'
        run: terraform -chdir=infra/production init -backend=false -input=false && terraform -chdir=infra/production validate
      - name: No infrastructure changes
        if: steps.scope.outputs.run == 'false'
        run: echo "Infrastructure checks are not needed for this change."

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Python changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]] || \
            python scripts/changed_scope.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --scope python; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install uv==0.8.13
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: uv sync --frozen --extra dev
      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: uv run pytest -q
      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: uv run ruff check .
      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: uv run ruff format --check .
      - name: No Python changes
        if: steps.scope.outputs.run == 'false'
        run: echo "Python checks are not needed for this change."

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Web changes
        id: scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]] || \
            python scripts/changed_scope.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --scope web; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: Test
        if: steps.scope.outputs.run == 'true'
        run: npm test
      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint
      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: No Web changes
        if: steps.scope.outputs.run == 'false'
        run: echo "Web checks are not needed for this change."

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: scripts/install_ci_tools.sh gitleaks
      - name: Scan Git history
        run: gitleaks git . --no-banner --redact
