name: External links

on:
  schedule:
    - cron: "15 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check product links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external links
        run: python scripts/check_external_links.py web/src/content/external-links.json
