name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to inspect
        required: true
        default: main
        type: string
      root:
        description: Terraform root to plan
        required: true
        default: production
        type: choice
        options:
          - bootstrap
          - storage
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: terraform-plan
  cancel-in-progress: true

jobs:
  plan:
    name: ${{ inputs.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install Terraform
        run: scripts/install_ci_tools.sh terraform
      - name: Set up Node.js
        if: inputs.root == 'production'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build deployable assets
        if: inputs.root == 'production'
        working-directory: web
        run: npm ci && npm run build
      - name: Plan initial backend bucket
        if: inputs.root == 'bootstrap'
        run: python scripts/terraform_backend.py bootstrap-plan
      - name: Plan remote root
        if: inputs.root != 'bootstrap'
        run: |
          terraform -chdir=infra/${{ inputs.root }} init -input=false
          terraform -chdir=infra/${{ inputs.root }} plan -input=false -lock-timeout=5m
