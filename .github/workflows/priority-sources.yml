name: Priority species sources

on:
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check official sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare official source content
        id: compare
        shell: bash
        run: |
          set +e
          PYTHONPATH=ml python scripts/check_priority_sources.py ml/taxonomy/priority-registry.json --report priority-source-report.json
          status=$?
          set -e
          if [[ "${status}" -eq 2 ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" -eq 0 ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${status}"
          fi
      - name: Open or update the review issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: 重点種台帳の公式ソースが更新されました
        shell: bash
        run: |
          {
            echo "公式ソースの本文変更を検知しました。自動で法的ステータスは変更していません。"
            echo
            echo '```json'
            cat priority-source-report.json
            echo '```'
            echo
            echo "公式発表を確認して台帳を更新し、レビュー後に次を実行してください。"
            echo
            echo '```console'
            echo "task priority:sources:refresh"
            echo '```'
          } > priority-source-issue.md
          issue_number="$(gh issue list --state open --search "${ISSUE_TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --body-file priority-source-issue.md
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file priority-source-issue.md
          fi
