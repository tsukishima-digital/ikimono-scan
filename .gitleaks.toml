[extend]
useDefault = true

[[rules]]
id = "public-repository-personal-identifiers"
description = "Personal environment identifiers do not belong in the public repository."
regex = '''(?i)(?:[a-z0-9._%+-]+@gmail[.]com|/Users/[a-z0-9._-]+(?:/|$)|[a-z0-9-]+[.]ts[.]net)'''
keywords = ["@gmail", "/Users/", ".ts.net"]

[rules.allowlist]
paths = ['''^\.gitleaks\.toml$''']
