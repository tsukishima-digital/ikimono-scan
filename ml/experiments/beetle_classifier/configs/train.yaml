seed: 42

data:
  raw_dir: ml/data/beetles/raw/inaturalist
  processed_dir: ml/data/beetles/processed
  train_split: 0.8
  val_split: 0.2
  min_images_per_class: 10
  image_size: 224
  num_workers: 4

model:
  architecture: mobilenet_v3_small
  pretrained: true

training:
  epochs: 10
  batch_size: 64
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  lr_scheduler:
    type: cosine
    min_learning_rate: 0.000001
  mixed_precision: true
  mixed_precision_dtype: fp16

output:
  model_dir: ml/models/beetles
  report_dir: ml/experiments/beetle_classifier/reports

tracking:
  backend: mlflow
  tracking_uri: sqlite:///ml/experiments/beetle_classifier/.cache/mlflow.db
  experiment_name: beetle_classifier
  run_name: auto
  dataset_name: beetle_classifier
  model_name: auto
  required_git_branch: main
  log_model: true
