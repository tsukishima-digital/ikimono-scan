seed: 42

data:
  raw_dir: ml/data/japan_species_smoke/raw/inaturalist
  processed_dir: ml/data/japan_species_smoke/processed
  train_split: 0.8
  val_split: 0.2
  min_images_per_class: 10
  image_size: 224
  num_workers: 2

model:
  architecture: mobilenet_v3_small
  pretrained: false

training:
  epochs: 1
  batch_size: 8
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  lr_scheduler:
    type: cosine
    min_learning_rate: 0.000001
  mixed_precision: true
  mixed_precision_dtype: fp16

output:
  model_dir: ml/models/japan_species_smoke
  report_dir: ml/experiments/japan_species_classifier/reports/smoke

tracking:
  backend: none
  log_model: false
