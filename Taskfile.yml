version: "3"

tasks:
  default:
    desc: List available development commands
    cmds:
      - task --list

  dev:
    desc: Start the web app and print model-free result fixture URLs
    dir: web
    cmds:
      - echo "Result fixtures /__dev/result?case=target|uncertain|no-alternatives|long-name"
      - npm run dev -- --host 127.0.0.1 --port {{.PORT | default "5175"}}

  dev:mobile:
    desc: Start the Access-protected HTTPS preview for mobile UI checks
    deps: [ui:assets]
    vars:
      WEB_ROOT: '{{.WEB_ROOT | default "web"}}'
    env:
      IKIMONO_SCAN_WEB_ROOT: "{{.WEB_ROOT}}"
    cmds:
      - python scripts/mobile_preview.py

  preview:provision:
    desc: Dispatch the workflow that provisions the private preview endpoint
    cmds:
      - gh workflow run preview.yml --ref main --field confirmation="provision dev.ikimono-scan.app"

  ui:
    desc: Run the fast UI feedback checks in parallel
    deps: [ui:test, ui:lint, ui:typecheck]

  ui:test:
    desc: Run web tests; pass a path after -- to target one file
    dir: web
    cmds:
      - npm test -- {{.CLI_ARGS}}

  ui:assets:
    desc: Check bundled gallery assets, licenses, and metadata
    vars:
      WEB_ROOT: '{{.WEB_ROOT | default "web"}}'
    dir: "{{.WEB_ROOT}}"
    cmds:
      - npm test -- src/content/specimen-gallery.test.ts
      - uv run --project .. pytest -q ../ml/tests/test_species_gallery.py

  gallery:build:
    desc: Select licensed iNaturalist photos and rebuild the species gallery
    cmds:
      - uv run python scripts/build_species_gallery.py --retry-missing

  gallery:check:
    desc: Verify species gallery licenses, provenance, and model coverage
    cmds:
      - uv run pytest -q ml/tests/test_species_gallery.py

  ui:lint:
    desc: Lint the web app
    dir: web
    cmds:
      - npm run lint

  ui:typecheck:
    desc: Type-check the web app without a production build
    dir: web
    cmds:
      - npm run typecheck

  ui:e2e:
    desc: Run Playwright against a production-like local build
    dir: web
    cmds:
      - npm run e2e

  ui:e2e:heic:
    desc: Run the HEIC preprocessing contract on macOS WebKit
    dir: web
    cmds:
      - npm run e2e:heic

  ui:build:
    desc: Build the production web bundle
    dir: web
    cmds:
      - npm run build

  python:
    desc: Run Python tests, lint, and formatting checks in parallel
    deps: [python:test, python:lint, python:format]

  python:test:
    cmds:
      - uv run pytest -q

  python:lint:
    cmds:
      - uv run ruff check .

  python:format:
    cmds:
      - uv run ruff format --check .

  infra:format:
    desc: Format Terraform configuration
    cmds:
      - terraform fmt -recursive infra

  infra:validate:
    desc: Validate all Terraform roots without contacting remote state
    deps: [ui:build, infra:validate:config]

  infra:validate:config:
    desc: Check Terraform formatting and validate all roots without building assets
    cmds:
      - terraform fmt -check -recursive infra
      - terraform -chdir=infra/bootstrap init -backend=false -input=false
      - terraform -chdir=infra/bootstrap validate
      - terraform -chdir=infra/storage init -backend=false -input=false
      - terraform -chdir=infra/storage validate
      - terraform -chdir=infra/preview init -backend=false -input=false
      - terraform -chdir=infra/preview validate
      - terraform -chdir=infra/production init -backend=false -input=false
      - terraform -chdir=infra/production validate

  infra:bootstrap:plan:
    desc: Preview creation of the Terraform state bucket with a temporary local backend
    cmds:
      - python scripts/terraform_backend.py bootstrap-plan

  infra:bootstrap:
    desc: Create the state bucket and immediately migrate its state to R2
    cmds:
      - python scripts/terraform_backend.py bootstrap

  infra:init:
    desc: Initialize an R2-backed Terraform root
    vars:
      ROOT: '{{.ROOT | default "production"}}'
    cmds:
      - terraform -chdir=infra/{{.ROOT}} init -input=false

  infra:plan:
    desc: Create a Terraform plan; pass ROOT and PLAN_FILE to select its destination
    deps: [ui:build]
    vars:
      ROOT: '{{.ROOT | default "production"}}'
      PLAN_FILE: '{{.PLAN_FILE | default "deployment.tfplan"}}'
    cmds:
      - terraform -chdir=infra/{{.ROOT}} init -input=false
      - terraform -chdir=infra/{{.ROOT}} plan -input=false -lock-timeout=5m -out={{.PLAN_FILE}}

  infra:lock-test:
    desc: Verify that R2 rejects a duplicate conditional lock write
    cmds:
      - python scripts/terraform_backend.py lock-test

  infra:backup:
    desc: Save a content-addressed state snapshot; LABEL must be pre-apply or post-apply
    vars:
      ROOT: '{{.ROOT | default "production"}}'
      LABEL: '{{.LABEL | default "pre-apply"}}'
    cmds:
      - python scripts/terraform_backend.py backup {{.ROOT}} {{.LABEL}}

  deploy:check:
    desc: Run every local gate required before production deployment
    deps: [release:check, infra:validate:config]

  deploy:
    desc: Dispatch the production deployment workflow on main
    cmds:
      - gh workflow run deploy.yml --ref main --field confirmation="deploy ikimono-scan.app"

  deploy:smoke:
    desc: Check the deployed application endpoint
    cmds:
      - curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-max-time 180 --retry-all-errors https://ikimono-scan.app/ >/dev/null

  deploy:e2e:
    desc: Run the real-model browser smoke against production
    dir: web
    cmds:
      - E2E_PUBLIC_BASE_URL=https://ikimono-scan.app npm run e2e:production

  unpublish:
    desc: Dispatch the workflow that removes the production custom domain
    cmds:
      - gh workflow run unpublish.yml --ref main --field confirmation="unpublish ikimono-scan.app"

  unpublish:smoke:
    desc: Check that the application endpoint is no longer publicly available
    cmds:
      - |
        for attempt in $(seq 1 18); do
          if ! curl --fail --silent --show-error --max-time 10 https://ikimono-scan.app/ >/dev/null 2>&1; then
            echo "ikimono-scan.app is no longer publicly available."
            exit 0
          fi
          echo "ikimono-scan.app is still available; retrying (${attempt}/18)."
          sleep 10
        done
        echo "ikimono-scan.app remained publicly available after unpublishing."
        exit 1

  model:export:
    desc: Export a checkpoint into a locally staged ONNX bundle
    requires:
      vars: [CHECKPOINT, VERSION, LICENSE, SOURCE]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default (printf "artifacts/models/v%s" .VERSION)}}'
    env:
      MODEL_CHECKPOINT: "{{.CHECKPOINT}}"
      MODEL_LICENSE: "{{.LICENSE}}"
      MODEL_OUTPUT_DIR: "{{.OUTPUT_DIR}}"
      MODEL_SOURCE: "{{.SOURCE}}"
      MODEL_VERSION: "{{.VERSION}}"
    cmds:
      - uv run ikimono-scan-ml-export-web --checkpoint "$MODEL_CHECKPOINT" --output-dir "$MODEL_OUTPUT_DIR" --version "$MODEL_VERSION" --license "$MODEL_LICENSE" --source "$MODEL_SOURCE"
      - python scripts/verify_model_release.py "$MODEL_OUTPUT_DIR/manifest.json" "$MODEL_OUTPUT_DIR/beetles-v$MODEL_VERSION.onnx"

  model:upload:
    desc: Upload a verified ONNX model to R2 and stage its manifest for deployment
    requires:
      vars: [BUNDLE_DIR]
    env:
      MODEL_BUNDLE_DIR: "{{.BUNDLE_DIR}}"
    cmds:
      - python scripts/publish_model.py --bundle-dir "$MODEL_BUNDLE_DIR"

  model:smoke:
    desc: Verify the public model against the tracked manifest
    cmds:
      - python scripts/verify_public_model.py web/public/models/manifest.json

  model:prepare-and-upload:
    desc: Export, verify, and upload a checkpoint without deploying the app
    requires:
      vars: [CHECKPOINT, VERSION, LICENSE, SOURCE]
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default (printf "artifacts/models/v%s" .VERSION)}}'
    cmds:
      - task: model:export
        vars:
          CHECKPOINT: "{{.CHECKPOINT}}"
          VERSION: "{{.VERSION}}"
          LICENSE: "{{.LICENSE}}"
          SOURCE: "{{.SOURCE}}"
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
      - task: model:upload
        vars:
          BUNDLE_DIR: "{{.OUTPUT_DIR}}"

  secrets:
    desc: Scan tracked files for secrets
    cmds:
      - uv run pre-commit run gitleaks --all-files

  hooks:install:
    desc: Install the pre-commit and pre-push quality gates
    cmds:
      - uv run pre-commit install

  check:
    desc: Run only checks relevant to current working-tree changes
    cmds:
      - |
        scopes="$(python scripts/changed_scope.py --working-tree)"
        tasks=""
        echo "$scopes" | grep -qx web && tasks="$tasks ui"
        echo "$scopes" | grep -qx python && tasks="$tasks python"
        echo "$scopes" | grep -qx infra && tasks="$tasks infra:validate"
        if [ -n "$tasks" ]; then task --parallel $tasks; else echo "No executable checks are needed."; fi

  release:check:
    desc: Run build, Python, and secret checks for release-sensitive changes
    deps: [ui:build, python, secrets]
